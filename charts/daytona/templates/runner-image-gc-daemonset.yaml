{{- if and .Values.services.runner.enabled .Values.services.runnerImageGc.enabled (eq (.Values.services.runner.env.CONTAINER_RUNTIME | default "docker") "docker") }}
{{- /*
Frees the runner's Docker disk of images Daytona pulled but never deletes.

To create a snapshot the runner pulls the source image, tags it as
`<registry>/daytona-<hash>:daytona` and pushes that copy. With v2 (job-based)
runners the API marks the snapshot active when the pull job completes, which
skips the API step that removes the source tag.
Daytona later removes only the `daytona-*` tag, so the source tag keeps every
layer forever. Once the runner's XFS Docker disk passes 75%, its availability
score drops below the 30 a new snapshot needs, and every new snapshot stays
`pending`.

A tag is un-tagged once two passes in a row have seen it on an image whose
`daytona-*` tag has been pushed (has a digest). The pull job inspects the
source tag after its push, and a new tag on an already-pushed image would
otherwise go before the runner re-tags it. Un-tagging deletes nothing a
sandbox runs from: when Daytona later removes the `daytona-*` tag, the image
has no tags left and Docker deletes it. `docker image prune` (dangling only)
frees digest-pinned sources (`repo:<none>`) the same way. A separate
DaemonSet, so rolling it out never restarts runner pods.

A snapshot retired within about two minutes of its pull keeps its source tag.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "daytona.fullname" . }}-runner-image-gc
  namespace: {{ include "daytona.namespace" . }}
  labels:
    {{- include "daytona.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-image-gc
spec:
  selector:
    matchLabels:
      {{- include "daytona.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner-image-gc
  template:
    metadata:
      labels:
        {{- include "daytona.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner-image-gc
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Same nodes as the runner DaemonSet.
      nodeSelector:
        daytona-sandbox-c: "true"
      tolerations:
        - key: "sandbox"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 5
      containers:
        - name: image-gc
          # The runner image already ships the docker CLI and is already on the node.
          image: "{{ include "daytona.imageRegistry" (dict "Values" .Values "serviceRegistry" .Values.services.runner.image.registry) }}/{{ .Values.services.runner.image.repository }}:{{ .Values.services.runner.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.services.runner.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              touch /tmp/ready
              while :; do
                : > /tmp/now
                docker images --digests --format '{{ "{{.ID}} {{.Repository}}:{{.Tag}} {{.Digest}}" }}' | awk '
                  FILENAME == "/tmp/ready" { ready[$0] = 1; next }
                  $2 ~ /(^|\/)daytona-[0-9a-f]+:daytona$/ { if ($3 != "<none>") pushed[$1] = 1; next }
                  $2 !~ /<none>/ { image[$2] = $1 }
                  END { for (t in image) if (image[t] in pushed) { print t > "/tmp/now"; if (t in ready) print t } }' /tmp/ready - |
                  xargs -r docker rmi
                mv /tmp/now /tmp/ready
                docker image prune -f
                sleep 60
              done
          resources:
            {{- toYaml .Values.services.runnerImageGc.resources | nindent 12 }}
          volumeMounts:
            - name: docker-run
              mountPath: /var/run
      volumes:
        # The directory, like the runner: dockerd recreates its socket on every
        # restart, and a mount of the socket file would keep the dead one.
        - name: docker-run
          hostPath:
            path: /var/run/
            type: Directory
{{- end }}
